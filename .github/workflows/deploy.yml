name: Uppdatera kalender

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'   # var 30:e minut (GitHub kan ibland vara lite sen)
  workflow_dispatch:          # gör det möjligt att köra manuellt under "Actions"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          ICS_URL: ${{ secrets.ICS_URL }}
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
